version: "2"

run:
  concurrency: 4
  timeout: 5m
  modules-download-mode: readonly
  go: "1.25"
  tests: false

formatters:
  enable:
    - gofmt
    - goimports
  
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: github.com/yuru-sha/go-cli-ddd

linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - revive
    - modernize
    - gosec
    - bodyclose
    - rowserrcheck
    - sqlclosecheck

  settings:
    gosec:
      excludes:
        - G101
        - G104
        - G106
        - G115
        - G301
        - G302
        - G304
        - G306
    staticcheck:
      checks: 
        - all
        - "-ST1000"
        - SA1019
    revive:
      rules:
        - name: exported
          disabled: false
        - name: var-naming
          disabled: false
        - name: package-comments
          disabled: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-files:
    - ".*\\.generated\\.go$"
    - ".*\\.pb\\.go$"
    - ".*\\.mock\\.go$"
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
    - path: wire_gen\.go
      linters:
        - staticcheck

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
