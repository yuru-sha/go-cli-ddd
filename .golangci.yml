version: "2"

run:
  concurrency: 4
  timeout: 5m
  modules-download-mode: readonly
  go: "1.25"
  tests: false

linters:
  enable:
    - bodyclose
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - modernize
    - revive
    - staticcheck
    - unused

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  staticcheck:
    checks: ["all"]
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false
      - name: unexported-return
        severity: warning
        disabled: false
      - name: var-declaration
        severity: warning
        disabled: false
  gosec:
    excludes:
      - G104
      - G114

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
  exclude-files:
    - ".*\\.generated\\.go$"
    - ".*\\.pb\\.go$"
    - ".*\\.mock\\.go$"
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
  exclude-use-default: true
  exclude:
    - "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.(Remove|RemoveAll)|.*printf?|os\\.(Un)?Setenv). is not checked"
